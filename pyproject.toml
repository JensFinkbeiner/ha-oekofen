[project]
name = "ha-oekofen"
version = "0.1.0"
description = "Home Assistant custom integration for ÖkoFEN Pellematic boilers (local JSON interface, read-only)"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"

[dependency-groups]
dev = [
  # Pins the matching homeassistant version (see its README / const.py).
  "pytest-homeassistant-custom-component==0.13.375",
  "syrupy",
  "aioresponses",
  "ruff",
  "mypy",
  "pytest-cov",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=custom_components.oekofen --cov-report=term-missing"

[tool.coverage.report]
fail_under = 95

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "ASYNC", "PT", "TC", "D"]
ignore = ["D203", "D213", "PLR2004", "TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.oekofen"]
known-third-party = ["homeassistant"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["custom_components.oekofen"]
explicit_package_bases = true
